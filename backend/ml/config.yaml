# ResiliChain AI — ML configuration.
# All knobs for data loading, features, models, evaluation and batch scale.
# Relative paths are resolved against the backend/ directory.

random_seed: 42

data:
  # sqlite -> read sales_history (joined to retail_stores for warehouse ids)
  # csv    -> read csv_path with columns: date, product_id, demand
  #           (optional: warehouse_id, price, promotion, holiday, region)
  source: sqlite
  sqlite_path: dev.db
  csv_path: null
  min_history_days: 90          # a series below this is not trainable
  fill_missing_dates: true      # reindex each series to a full daily range
  fill_value: 0.0               # demand on missing dates (seeder drops zero days)
  negative_strategy: zero       # zero | drop
  outliers:
    method: iqr                 # iqr | zscore | none
    strategy: flag              # flag | clip | remove
    iqr_multiplier: 3.0
    zscore_threshold: 4.0

series:
  # product           -> one series per product (daily sum over all stores)
  # product_warehouse -> one series per (product, warehouse)
  # auto              -> product_warehouse when that slice has enough history,
  #                      else fall back to product level (recorded in metadata)
  level: auto
  min_warehouse_history_days: 90

forecast:
  horizon_days: 30
  confidence_level: 0.95

validation:
  # chronological split: the last `val_days` are held out for model
  # comparison; `test_days` (optional) are held out after that and never
  # touched during selection.
  val_days: 28
  test_days: 0

features:
  lags: [1, 7, 14, 28]
  rolling_windows: [7, 14, 28]     # rolling means (window ends at t-1)
  rolling_std_windows: [7, 28]     # rolling stds  (window ends at t-1)

models:
  prophet:
    weekly_seasonality: auto       # auto -> on when history >= 14 days
    yearly_seasonality: auto       # auto -> on only when history >= yearly_min_days
    yearly_min_days: 730           # need ~2 cycles to separate yearly from trend
    daily_seasonality: false
    interval_width: 0.95
  xgboost:
    n_estimators: 400
    learning_rate: 0.05
    max_depth: 5
    subsample: 0.9
    colsample_bytree: 0.9
    min_child_weight: 3.0
    early_stopping_rounds: 40

selection:
  primary_metric: wape             # wape | mae | rmse | smape
  tie_breaker: mae

batch:
  max_series: 10                   # cap for `--product all` (avoid 1000s of models)

paths:
  models_dir: ml/models
  artifacts_dir: ml/artifacts
